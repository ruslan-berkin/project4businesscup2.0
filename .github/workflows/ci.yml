name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python ${{ matrix.python }} / runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: tabescape_app
    env:
      OPENAI_ENABLED: 'false'
      OPENAI_API_KEY: ''
      TABESCAPE_SECRET_KEY: ci-only-not-for-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tabescape_app/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Runtime, story branches and standalone recovery
        run: python -m unittest discover -s tests -v
      - name: Gunicorn configuration
        run: gunicorn app:app --check-config --timeout 60
      - name: Check embedded assets are reproducible
        run: |
          python scripts/embed_assets.py
          git diff --exit-code -- app.py
  javascript:
    name: JavaScript and formula checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: |
          for file in tabescape_app/static/js/*.js; do
            node --check "$file"
          done
      - run: node tabescape_app/tests/formulas.test.cjs
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: pip-audit -r tabescape_app/requirements.txt
