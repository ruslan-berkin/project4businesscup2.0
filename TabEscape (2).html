<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabEscape</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='22' height='26' rx='3' fill='%2321a366'/%3E%3Cpath d='M6 10h22v7H6z' fill='%23107c41'/%3E%3Crect x='2' y='7' width='14' height='18' rx='2.5' fill='%23185c37'/%3E%3Cpath d='M5.5 11.5l7 9m0-9l-7 9' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
/* ===== Оригинальная тема Excel Web (Office 365) ===== */
:root {
    --green: #107c41;
    --green-dark: #0b5d31;
    --green-soft: #e6f2ea;
    --accent: #107c41;
    --bg: #f3f2f1;
    --chrome-bg: #f3f2f1;
    --ribbon-bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #faf9f8;
    --border: #e1dfdd;
    --border-strong: #c8c6c4;
    --grid-line: #d4d4d4;
    --head-bg: #f3f2f1;
    --head-hover: #e1dfdd;
    --head-sel: #dff6dd;
    --head-sel-text: #0b5d31;
    --text: #242424;
    --text-dim: #616161;
    --hover: #ebe9e7;
    --ok: #0f7b0f;   --ok-bg: #dff6dd;
    --warn: #8a5a00; --warn-bg: #fff4ce;
    --bad: #b10e1c;  --bad-bg: #fde7e9;
    --bar-ok: #6cc08b; --bar-warn: #f2c661; --bar-bad: #e8737c;
    --shadow: 0 8px 28px rgba(0,0,0,.18);
    --font: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --zoom: 1;
}

:root[data-theme="dark"] {
    --bg: #1f1f1f;
    --chrome-bg: #292929;
    --ribbon-bg: #333333;
    --surface: #1f1f1f;
    --surface-2: #292929;
    --border: #3d3d3d;
    --border-strong: #5a5a5a;
    --grid-line: #3b3b3b;
    --head-bg: #292929;
    --head-hover: #383838;
    --head-sel: #1f4a33;
    --head-sel-text: #7fdc7f;
    --text: #f0f0f0;
    --text-dim: #b0b0b0;
    --hover: #383838;
    --green-soft: #1f3a2b;
    --accent: #3fb878;
    --ok: #7fdc7f; --ok-bg: #1d3a1f;
    --warn: #f0c35b; --warn-bg: #3d3216;
    --bad: #ff8b94; --bad-bg: #4a1f24;
    --shadow: 0 8px 28px rgba(0,0,0,.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ===== Верхняя строка заголовка (Office 365 Light Chrome) ===== */
.titlebar {
    height: 44px;
    background: var(--chrome-bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 12px 0 8px;
    flex: none;
}
.tb-left, .tb-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-left { flex: 1 1 0; }
.tb-right { flex: 1 1 0; justify-content: flex-end; gap: 10px; }

.icon-btn {
    background: transparent;
    border: 0;
    border-radius: 4px;
    width: 32px;
    height: 32px;
    display: inline-grid;
    place-items: center;
    color: var(--text);
}
.icon-btn:hover:not(:disabled) { background: var(--hover); }
.icon-btn.small { width: 24px; height: 24px; font-size: 12px; color: var(--text-dim); }
.icon-btn.tiny { width: 20px; height: 20px; font-size: 12px; color: var(--text-dim); border-radius: 3px; }

.excel-logo {
    display: inline-grid;
    place-items: center;
    width: 24px;
    height: 24px;
    flex: none;
}
.doc-title {
    font-weight: 400;
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
}
.doc-title:hover { background: var(--hover); }

.cloud-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 5px;
    border-radius: 4px;
    color: var(--green);
}
.cloud-status.syncing svg { animation: pulse .8s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

.tb-search {
    flex: 0 1 460px;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text-dim);
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.tb-search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
    color: var(--text);
}
.tb-search input {
    flex: 1;
    min-width: 0;
    background: none;
    border: 0;
    outline: 0;
    font-size: 13px;
    color: var(--text);
}
.tb-search input::placeholder { color: var(--text-dim); }

.avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--chrome-bg);
    color: var(--text);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 600;
    border: 1.3px solid #616161;
    cursor: pointer;
    user-select: none;
}
.avatar:hover { background: var(--hover); }

/* ===== Строка меню и лента инструментов ===== */
.ribbon {
    background: var(--chrome-bg);
    flex: none;
}
.menubar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 0 6px;
    min-height: 34px;
    gap: 8px;
}
.ribbon-tabs {
    display: flex;
    align-items: center;
    gap: 1px;
    overflow-x: auto;
    scrollbar-width: none;
}
.ribbon-tabs::-webkit-scrollbar { display: none; }

.rtab {
    background: transparent;
    border: 0;
    padding: 6px 10px 7px;
    position: relative;
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    white-space: nowrap;
}
.rtab:hover { background: var(--hover); }
.rtab.active {
    font-weight: 600;
    color: var(--text);
}
.rtab.active::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 1px;
    height: 3px;
    border-radius: 2px;
    background: var(--green);
}

.menubar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
}
.mb-btn {
    height: 26px;
    padding: 0 9px;
    border-radius: 4px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    white-space: nowrap;
}
.mb-btn:hover { background: var(--surface-2); border-color: #999; }
.mb-btn.icon-only { padding: 0 7px; }
.mb-btn .chev { font-size: 10px; color: var(--text-dim); }
.mb-btn.share-green {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
    font-weight: 500;
}
.mb-btn.share-green .chev { color: rgba(255,255,255,.85); }
.mb-btn.share-green:hover { background: var(--green-dark); border-color: var(--green-dark); }

/* Панель инструментов ленты */
.ribbon-body {
    margin: 2px 8px 4px;
    background: var(--ribbon-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 2px;
    min-height: 42px;
    overflow-x: auto;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.ribbon-body.collapsed { display: none; }

.rgroup {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 8px;
    border-right: 1px solid var(--border);
    flex: none;
    height: 32px;
}
.rgroup:last-child { border-right: 0; }
.rg-items { display: flex; align-items: center; gap: 3px; }
.rg-title { display: none; }

.rbtn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 0 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-width: 28px;
    height: 28px;
    font-size: 12.5px;
    white-space: nowrap;
}
.rbtn:hover { background: var(--hover); }
.rbtn.on { background: var(--head-sel); border-color: var(--green); color: var(--green-dark); }
.rbtn.primary { background: var(--green); color: #fff; font-weight: 500; }
.rbtn.primary:hover { background: var(--green-dark); }
.rbtn .ico { font-size: 14px; line-height: 1; display: inline-flex; align-items: center; }

.rselect-input {
    height: 26px;
    padding: 0 6px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--surface);
    font-size: 12px;
    color: var(--text);
    outline: 0;
}
.rselect-input:focus { border-color: var(--green); }

.swatch-btn {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 4px;
}
.swatch-btn:hover { background: var(--hover); }
.swatch-bar {
    width: 16px;
    height: 4px;
    border-radius: 1px;
    border: 1px solid rgba(0,0,0,.2);
    margin-top: 1px;
}

/* ===== Строка формул ===== */
.formula-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px 5px;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--border);
    flex: none;
}
.name-box-wrap {
    position: relative;
    display: flex;
    align-items: center;
    width: 102px;
    height: 26px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    flex: none;
}
.name-box-wrap:focus-within { border-color: var(--green); }
.name-box {
    width: 100%;
    height: 100%;
    padding: 0 20px 0 8px;
    border: 0;
    background: transparent;
    outline: 0;
    font-size: 12.5px;
    color: var(--text);
}
.nb-chev {
    position: absolute;
    right: 6px;
    font-size: 10px;
    color: var(--text-dim);
    pointer-events: none;
}
.fb-actions {
    display: flex;
    align-items: center;
    height: 26px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 2px;
    flex: none;
}
.fb-actions .icon-btn.small { width: 24px; height: 22px; border-radius: 3px; }
.fb-actions .fx-btn { width: 34px; position: relative; padding-right: 10px; }
.fx {
    font-family: "Times New Roman", Georgia, serif;
    font-style: italic;
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
}
.formula-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    height: 26px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 6px 0 8px;
}
.formula-input-wrap:focus-within {
    border-color: var(--green);
    box-shadow: 0 0 0 1px var(--green);
}
.formula-input {
    flex: 1;
    height: 100%;
    border: 0;
    background: transparent;
    outline: 0;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
}
.fb-expand {
    font-size: 12px;
    color: var(--text-dim);
    padding: 0 2px;
    user-select: none;
}

/* ===== Табличная сетка ===== */
.grid td.spill { overflow: visible; z-index: 1; text-overflow: clip; }
.grid td.nb { border-right-color: transparent; }
.grid td.vm { vertical-align: middle; }
.grid td.vt { vertical-align: top; }
.grid td.vb { vertical-align: bottom; }
.grid td.wrap { white-space: pre-wrap; word-break: break-word; overflow: hidden; }

.grid-wrap { flex: 1; min-height: 0; background: var(--surface); position: relative; }
.grid-scroll { position: absolute; inset: 0; overflow: auto; }
.grid {
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    font-size: calc(13px * var(--zoom));
    background: var(--surface);
    user-select: none;
}
.grid th, .grid td {
    border-right: 1px solid var(--grid-line);
    border-bottom: 1px solid var(--grid-line);
    padding: 0 calc(4px * var(--zoom));
    height: calc(var(--rh, 20px) * var(--zoom));
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    position: relative;
    background-clip: padding-box;
}
.grid thead th {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--head-bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 400;
    text-align: center;
    height: 22px;
    border-bottom: 1px solid var(--border-strong);
    border-right: 1px solid var(--border-strong);
}
.grid th.rn {
    position: sticky;
    left: 0;
    z-index: 9;
    background: var(--head-bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 400;
    text-align: center;
    border-right: 1px solid var(--border-strong);
    border-bottom: 1px solid var(--border-strong);
}
.grid thead th.corner {
    left: 0;
    z-index: 12;
    padding: 0;
    background: var(--head-bg);
}
.grid thead th.corner::after {
    content: "";
    position: absolute;
    right: 3px;
    bottom: 3px;
    border: 5px solid transparent;
    border-right-color: #8a8886;
    border-bottom-color: #8a8886;
}
.grid thead th:hover, .grid th.rn:hover { background: var(--head-hover); }
.grid thead th.hsel {
    background: var(--head-sel);
    color: var(--head-sel-text);
    font-weight: 600;
    border-bottom: 2px solid var(--green);
}
.grid th.rn.hsel {
    background: var(--head-sel);
    color: var(--head-sel-text);
    font-weight: 600;
    border-right: 2px solid var(--green);
}

/* Выделение ячеек и диапазона как в оригинальном Excel Web */
.grid td.sel {
    outline: 2px solid var(--green);
    outline-offset: -2px;
    z-index: 5;
}
.grid td.inrange {
    background-image: linear-gradient(rgba(16, 124, 65, 0.10), rgba(16, 124, 65, 0.10));
}
.grid td.inrange.anchor {
    background-image: none;
}
.grid td.sel-top { box-shadow: inset 0 2px 0 0 var(--green); }
.grid td.sel-bottom { box-shadow: inset 0 -2px 0 0 var(--green); }
.grid td.sel-left { box-shadow: inset 2px 0 0 0 var(--green); }
.grid td.sel-right { box-shadow: inset -2px 0 0 0 var(--green); }

.grid td.fill-handle::after {
    content: "";
    position: absolute;
    right: -1px;
    bottom: -1px;
    width: 6px;
    height: 6px;
    background: var(--green);
    border: 1px solid #ffffff;
    z-index: 7;
}

.grid td.l { text-align: left; }
.grid td.r { text-align: right; font-variant-numeric: tabular-nums; }
.grid td.c { text-align: center; }
.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
.grid td.neg { color: var(--bad); }
.grid td.pos { color: var(--ok); }
.grid td.err { color: var(--bad); text-align: center; }
.grid td.muted { color: var(--text-dim); }
.grid td.hdr, .grid tr.tbl-head td {
    background: var(--green);
    color: #fff;
    font-weight: 600;
    border-right-color: rgba(255,255,255,.25);
    border-bottom-color: rgba(255,255,255,.25);
}
.grid tr.tbl-head td.sel { outline-color: #fff; }
.grid tr.zebra td { background: var(--surface-2); }
.grid tr.total td { font-weight: 700; border-top: 2px solid var(--text); background: var(--surface); }
.grid td.code { color: var(--text-dim); font-family: "Cascadia Mono", Consolas, monospace; font-size: .92em; }
.grid td.bold { font-weight: 700; }
.grid td.ital { font-style: italic; }
.grid td.und { text-decoration: underline; }

/* Игровые ячейки */
.grid tr.story td { height: auto; }
.grid td.story {
    white-space: normal;
    line-height: 1.55;
    padding: calc(12px * var(--zoom)) calc(14px * var(--zoom));
    vertical-align: top;
    background: color-mix(in srgb, var(--accent) 5%, var(--surface));
    font-size: 1.06em;
    font-family: var(--font);
    min-width: 0;
}
.grid td.story.loading { color: var(--text-dim); font-style: italic; }
.grid td.story.fade { animation: fade .45s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.grid td.prompt { color: var(--text-dim); font-style: italic; background: var(--surface-2); }
.grid td.prompt.editing { color: var(--text); font-style: normal; }
.grid tr.opt td { cursor: pointer; }
.grid tr.opt td.optcell { white-space: normal; line-height: 1.45; padding-top: 7px; padding-bottom: 7px; height: auto; font-family: var(--font); font-size: 1.02em; }
.grid tr.opt:hover td { background: var(--green-soft); }
.grid tr.opt.disabled td { cursor: default; opacity: .6; }
.optkey {
    display: inline-grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    margin-right: 8px;
    background: var(--green);
    color: #fff;
    font-weight: 700;
    font-size: 11px;
}
.grid td.hl { color: var(--green); font-weight: 600; }

/* Панельки данных (databar) */
.databar { position: relative; height: calc(16px * var(--zoom)); }
.databar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; transition: width .5s ease, background .3s; }
.databar span { position: relative; z-index: 1; display: block; text-align: right; line-height: calc(16px * var(--zoom)); padding-right: 4px; font-weight: 600; }
.bar-ok i { background: var(--bar-ok); } .bar-warn i { background: var(--bar-warn); } .bar-bad i { background: var(--bar-bad); }
.badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: .88em; font-weight: 600; padding: 1px 8px; border-radius: 10px;
}
.badge::before { content: "●"; font-size: .8em; }
.badge.ok { color: var(--ok); background: var(--ok-bg); }
.badge.warn { color: var(--warn); background: var(--warn-bg); }
.badge.bad { color: var(--bad); background: var(--bad-bg); }

/* Диаграмма-объект */
.chart-object {
    position: absolute; top: 120px; left: 70px; width: 480px; height: 300px; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.14); padding: 10px 14px; z-index: 15;
}
.chart-object h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; text-align: center; }
.chart-object svg { width: 100%; height: calc(100% - 50px); }
.legend { display: flex; justify-content: center; gap: 14px; font-size: 11.5px; color: var(--text-dim); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

.use-btn {
    border: 1px solid var(--green); color: var(--green); background: transparent; border-radius: 4px; padding: 0 10px; height: 20px; font-size: .9em;
}
.use-btn:hover { background: var(--green); color: #fff; }

/* ===== Нижняя панель листов и строка состояния ===== */
.bottom {
    flex: none;
    background: var(--chrome-bg);
    border-top: 1px solid var(--border);
}
.sheet-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 8px;
    height: 32px;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--border);
}
.sheet-nav {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: none;
}
.sheet-tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
    min-width: 0;
}
.sheet-tabs::-webkit-scrollbar { display: none; }

.stab {
    border: 0;
    background: transparent;
    padding: 5px 12px 6px;
    border-radius: 4px 4px 0 0;
    white-space: nowrap;
    color: var(--text-dim);
    font-size: 12.5px;
    position: relative;
}
.stab:hover { background: var(--hover); color: var(--text); }
.stab.active {
    background: transparent;
    color: var(--text);
    font-weight: 600;
}
.stab.active::after {
    content: "";
    position: absolute;
    left: 6px;
    right: 6px;
    bottom: 0;
    height: 3px;
    border-radius: 2px;
    background: var(--green);
}
.stab.rpg-tab { color: #0b5d31; }
.add-sheet { flex: none; font-size: 15px; }

.statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 10px;
    font-size: 11.5px;
    background: var(--chrome-bg);
    color: var(--text-dim);
    height: 24px;
}
.sb-left, .sb-mid, .sb-right { display: flex; align-items: center; gap: 12px; }
.sb-workbook-stats { cursor: pointer; color: var(--text); }
.sb-workbook-stats:hover { text-decoration: underline; }
.sb-ready { color: var(--text-dim); }
.sb-mid { gap: 16px; color: var(--text); }
.sb-mid b { font-weight: 600; }
.sb-ico { cursor: pointer; font-size: 12px; padding: 1px 4px; border-radius: 3px; user-select: none; }
.sb-ico:hover { background: var(--hover); }
.zoom-label { min-width: 48px; text-align: center; cursor: pointer; color: var(--text); }
.zoom-label:hover { background: var(--hover); border-radius: 3px; }

/* Всплывающий список всех листов */
.sheets-popup {
    position: fixed;
    left: 12px;
    bottom: 60px;
    max-height: 320px;
    width: 240px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    box-shadow: var(--shadow);
    z-index: 45;
    padding: 4px;
}
.sheets-popup button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12.5px;
}
.sheets-popup button:hover { background: var(--hover); }
.sheets-popup button.active { background: var(--head-sel); color: var(--head-sel-text); font-weight: 600; }

/* ===== Уведомления (Тост) ===== */
.toast {
    position: fixed; left: 50%; bottom: 68px; transform: translate(-50%, 20px); background: #323130; color: #fff;
    padding: 8px 16px; border-radius: 6px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: all .22s; z-index: 50; max-width: 80vw; font-size: 12.5px;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== Модальное окно настроек ===== */
.modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 40;
    backdrop-filter: blur(2px);
}
.dialog { width: min(520px, 92vw); background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--border); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px 20px; }
.dlg-head h2 { font-size: 16px; font-weight: 600; }
.dlg-body { padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 6px; }
.dlg-desc { color: var(--text); line-height: 1.45; background: var(--green-soft); border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; font-size: 12.5px; }
.dlg-body label { margin-top: 8px; font-weight: 600; font-size: 12.5px; }
.dlg-body input {
    height: 32px; border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 10px; background: var(--surface); outline: 0;
}
.dlg-body input:focus { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
.dlg-body code { background: var(--hover); padding: 0 4px; border-radius: 3px; }
.hint { color: var(--text-dim); font-size: 11.5px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; background: var(--surface-2); border-top: 1px solid var(--border); }
.btn { height: 30px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 12.5px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
.btn.primary:hover { background: var(--green-dark); }

@media (max-width: 900px) {
    .tb-search, .sb-mid { display: none; }
    .chart-object { width: 90vw; }
}

.hero:before {content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#07151be6,#0b172545 53%,transparent 72%)}
.heroCopy {padding:clamp(26px,3.7vw,55px);max-width:680px}
.campaign,.eyeline,.mapPin,.hubFooter,.speaker,.shelfMeta {font-family:Consolas,"Courier New",monospace}
.campaign,.eyeline {font-size:11px;font-weight:700;letter-spacing:1.6px}
.campaign {display:flex;align-items:center;gap:9px;color:#b9ee9d}
.campaign i,.hubFooter i {display:inline-block;background:#a7e68a;width:7px;height:7px;box-shadow:2px 2px 0 #436840}
#welcome .hero h1 {font:650 clamp(43px,5.2vw,73px)/1.02 Georgia,"Times New Roman",serif;letter-spacing:-.055em;margin:16px 0 13px}
.hero h1 em {font-weight:600;color:#b5e88e}
.heroCopy>p {color:#edf1e7;max-width:370px;font-size:clamp(14px,1.2vw,16px);line-height:1.55}
.hero .playNow {margin-top:21px;min-height:45px;padding:10px 18px;color:#1d3624;background:#b4e995;box-shadow:0 3px 0 #43764e;border:1px solid #dcf7b8;border-radius:6px;font-size:14px;font-weight:750}
.hero .playNow:hover {background:#d0f8b4}
.playNow span {font-size:11px;margin-right:7px}
.mapPin {position:absolute;right:18px;bottom:15px;display:flex;align-items:center;gap:7px;color:#fffae9;background:#13241ce8;border:1px solid #9ab4918c;border-radius:4px;padding:4px 9px;font-size:11px}
.mapPin i {color:#f6ce8f;font-style:normal}
.workspaceShelf {padding:29px 0 20px}
.shelfHeading {justify-content:space-between;align-items:end;gap:15px}
.eyeline {color:#527047;margin:0 0 4px}
.shelfHeading h2 {font:600 clamp(25px,2.7vw,36px)/1.18 Georgia,serif;letter-spacing:-1.2px}
.shelfMeta {font-size:12px;color:#53665a;margin-bottom:4px}
.maskCards {grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 0}
.maskCard {display:grid;grid-template-columns:1fr auto;align-items:center;position:relative;color:#21352b;background:#fffef6;border:1px solid #c7d0bf;border-radius:10px;padding:16px 16px 14px;box-shadow:0 3px 0 #dbe1d2;transition:transform .18s,box-shadow .18s}
.maskCard:hover {border-color:#538459;box-shadow:0 4px 0 #a6bf9c;transform:translateY(-3px)}
.artifact {grid-column:1/-1;display:flex;align-items:center;justify-content:center;min-height:76px;border-radius:5px;background-color:var(--field);background-image:radial-gradient(var(--dot) .8px,transparent 1px);background-size:8px 8px;margin-bottom:12px}
.artifact img {width:65px;height:65px;image-rendering:pixelated;filter:drop-shadow(2px 4px 0 #263a3024)}
.maskCard.excel {--field:#e3eddb;--dot:#bfd2af}.maskCard.word{--field:#eae5f2;--dot:#cfc2db}
.maskCard.outlook {--field:#f4ead5;--dot:#dfd0b1}.maskCard.autocad {--field:#dfecec;--dot:#bfd3d1}
.maskCard h3 {font-size:18px;line-height:1.2;letter-spacing:-.55px;margin:0}
.maskCard .cardInfo p {font:13px/1.4 "Segoe UI",sans-serif;color:#526254;margin:5px 0 0}
.cardArrow {color:#45664b;font-size:18px;align-self:start}
.guideStrip {position:relative;overflow:hidden;gap:18px;min-height:85px;padding:10px 18px;background:#eeebf6;border:1px solid #d7d1e3;border-radius:10px}
.miraBust {position:relative;align-self:stretch;width:58px;flex:0 0 58px;overflow:hidden}
.miraBust img {position:absolute;top:1px;left:3px;width:53px;image-rendering:pixelated}
.guideStrip b {font:600 19px/1.3 Georgia,serif;color:#39314d}
.guideStrip p {font-size:13px;color:#565067;margin-top:2px}
.guideStrip button {margin-left:auto;border:1px solid #b9b0c8;background:#f8f6fc;font-size:13px;color:#483c5b}
.hubFooter {justify-content:space-between;gap:14px;padding:18px 0 24px;color:#576654;font-size:11px}
.hubFooter i {width:6px;height:6px;background:#68a266;box-shadow:none;margin-right:4px}
.tutorialLaunch {font-weight:700!important}
#workspaceTools {color:#233a2c;background:#f4f7ef;border-bottom-color:#cbd4c8}
#workspaceTools button {color:#263e32;background:#e6ece1;min-height:36px}
#workspaceTools #switchView {color:#f6fff0;background:#326547}
#workspaceTools .tutorialLaunch,#compactTools .tutorialLaunch {background:#ede7f6;color:#5b3d83}
:where(button,a,input,select,summary,[tabindex],[contenteditable]):focus-visible {outline:3px solid #8754c4!important;outline-offset:2px}
#workspaceTools,.alternative,.gameDocument,#alternateWork,#excelShell,.vitals {min-width:0}
.alternative {min-height:0;overflow:auto}
.vitals {width:100%}
.spotlight {position:fixed;z-index:2000;pointer-events:none;box-shadow:0 0 0 9999px #0d171cba,0 0 0 3px #a6eb8a,0 0 20px 6px #9ccd82;border:2px solid #c4f3a3;border-radius:7px;transition:top .22s,left .22s,width .22s,height .22s}
#guide {display:flex;position:fixed;z-index:2001;top:0;left:0;right:auto;bottom:auto;gap:10px;align-items:end;width:min(378px,calc(100% - 20px));margin:0;padding:0;border:none;box-shadow:none;background:transparent;color:#24332b;font:14px/1.45 "Segoe UI",system-ui,sans-serif;transition:top .22s,left .22s;pointer-events:none}
#guide .guideSprite {width:65px;height:auto;max-height:148px;object-fit:contain;align-self:end;image-rendering:pixelated;transform-origin:50% 95%;filter:drop-shadow(1px 2px 0 #101b1d);animation:mira-arrive .32s ease-out,mira-idle 2.5s .35s ease-in-out infinite}
#guide[data-step="2"] .guideSprite,#guide[data-step="4"] .guideSprite {rotate:-4deg}
@keyframes mira-arrive {from{opacity:0;transform:translateY(8px) scale(.92)}}
@keyframes mira-idle {0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
.speech {pointer-events:auto;position:relative;flex:1;min-width:0;padding:14px 16px;background:#fffdf2;border:2px solid #394b3b;border-radius:10px;box-shadow:0 4px 0 #2938296b}
.speech:before {content:"";position:absolute;left:-7px;bottom:24%;width:10px;height:10px;background:#fffdf2;border-left:2px solid #394b3b;border-bottom:2px solid #394b3b;transform:rotate(45deg)}
.speaker {display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#5a6859;margin-bottom:5px}
.speaker strong {color:#5b3c82;letter-spacing:1px;text-transform:uppercase}
#guide h2 {font:650 20px/1.15 Georgia,serif;letter-spacing:-.45px}
#guide p {margin:5px 0 10px;line-height:1.4}
.tourButtons {display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
#guide button {min-height:35px;padding:5px 10px;border:1px solid #c3cdbe;background:#f2f4eb;color:#293c2d;border-radius:5px;font-size:13px;font-weight:650}
#guide [data-go="skip"] {margin-right:auto;border-color:transparent;background:transparent;color:#546454}
#guide [data-go="next"] {background:#315f40;border-color:#315f40;color:#fff}
#guide button:disabled {opacity:.45;cursor:default}
body.tourActive {height:100dvh!important;min-height:0!important;overflow:hidden!important}
body.tourDock {padding-bottom:var(--dock-height)}
body.tourDock #guide {width:min(420px,calc(100% - 16px));bottom:8px;top:auto!important;left:50%!important;transform:translateX(-50%);gap:6px}
body.tourDock #guide .guideSprite {width:clamp(38px,11vw,58px);max-height:100px}
body.tourDock .speech {padding:9px 12px}
body.tourDock #guide button {min-height:40px}
body.tourDock #welcome {min-height:0}
@media(max-width:900px){
 .hubNav {min-height:67px}.hero {min-height:302px}.maskCard {padding:10px}.shelfMeta{font-size:11px}
 #workspaceTools button {min-height:40px}.wordWindowActions .tutorialLaunch {font-size:12px}
}
@media(max-width:800px){
 .alternative,.alternative.outlook,.alternative.autocad {grid-template-columns:minmax(0,1fr);overflow:auto;align-content:start;gap:12px}
 .alternative.word {display:flex;flex-direction:column;overflow:auto;gap:12px;padding:0 0 12px}
 .alternative.word>.wordChrome,.alternative.word>.gameDocument,.alternative.word>#altStats,.alternative.word>.wordStatus {flex:none}
 .alternative.word>.gameDocument,.alternative.word>#altStats {width:calc(100% - 20px);margin:0 auto}
 .alternative.word .wordChrome,.workPane.word .wordChrome {position:relative;top:auto;min-width:0}
 .alternative.word .gameDocument {min-height:0;padding:24px 18px}
 .alternative.word #altStats {grid-row:auto}
 .alternative .gameDocument,.alternative #altStats {min-width:0}
 .alternative .folders,.alternative .gameMailList {display:none}
 .alternative #altChoices button,.alternative #customForm button {min-height:44px}
 .alternative #altChoices {margin:14px 0}
 .alternative #altScene p {margin-bottom:10px}
 .alternative.excel {background:#e7eee5}
 .alternative.excel .gameDocument {border-top:4px solid #267344}
 .readerTabs {display:flex;gap:8px;padding:0 2px 8px}
 .readerTabs button {min-height:42px}
 #workspaceTools {flex-wrap:nowrap;overflow-x:auto;padding:5px 8px;width:100%}
 #workspaceTools>* {flex-shrink:0}#workspaceTools #switchView {order:-1}
 #excelShell {min-width:0;overflow:hidden}#excelShell .grid-scroll {min-height:0}
 .alternative.autocad .adventureMap {overflow:auto;min-width:0;padding:12px;gap:8px}
 .workPane.autocad .drawing {min-width:0;overflow:auto;padding:20px;min-height:250px}
 .workPane.outlook,.workPane.autocad {grid-template-columns:minmax(0,1fr);height:auto;min-height:100%}
 .workPane.outlook .reading {padding:20px}
 .alternative .wordQuick {flex-shrink:1;min-width:0}.wordTitle>strong {display:none}
 .wordWindowActions {margin-left:auto;flex-shrink:0}
 .hubNav {gap:12px}.shelfHeading {align-items:start}.shelfMeta {display:none}
}
@media(max-width:630px){
 .hubNav {gap:5px;min-height:62px}.wordmark {font-size:22px}.wordmark img {width:30px;height:30px;margin-right:4px}
 .hubNav button {padding:5px 9px;font-size:12px}.hubNav .langSwitch {padding:5px 7px;font-size:11px}
 .hubNav nav {gap:0}.hubNav .navWork {display:none}
 .hero {min-height:310px;background-position:62% center}
 .heroCopy {padding:23px 18px 37px}.heroCopy>p {max-width:255px;font-size:14px}
 .hero:before {background:linear-gradient(90deg,#0a1521ee,#0a1521aa 52%,#0a152126)}
 #welcome .hero h1 {font-size:clamp(40px,9.5vw,54px)}
 .campaign,.eyeline {font-size:10px}.mapPin {font-size:9px;bottom:8px;right:9px}
 .workspaceShelf {padding:23px 0 15px}.maskCards {grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
 .maskCard {padding:8px}.artifact {min-height:44px;margin-bottom:7px}.artifact img {width:43px;height:43px}
 .maskCard h3 {font-size:16px}.maskCard .cardInfo p {font-size:12px;margin-top:2px}
 .guideStrip {gap:7px;flex-wrap:wrap;padding:10px}.miraBust {width:32px;flex-basis:32px;min-height:42px}
 .miraBust img {width:32px;left:0}.guideStrip button {font-size:12px;padding:5px 8px}.guideStrip b{font-size:16px}
 .guideStrip p {font-size:12px}.hubFooter {align-items:start;font-size:10px}.hubFooter span:last-child {max-width:53%;text-align:right}
 .wordWindowActions button,.wordQuick .wordPanelToggle {min-height:34px}
}
@media(max-height:495px) {
 body.tourDock #guide {width:min(620px,calc(100% - 16px))}
 body.tourDock .speech {display:grid;grid-template-columns:1fr auto;gap:1px 10px}
 body.tourDock .speaker {grid-column:1/-1;margin:0}
 body.tourDock #guide .guideSprite {max-height:75px}
 body.tourDock #guide p {font-size:12px;margin-bottom:0}
 body.tourDock .tourButtons {align-self:end;flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){
 #guide .guideSprite,.grid td.story.fade {animation:none!important;rotate:none!important}
 .spotlight,#guide,.maskCard {transition:none!important}
}

</style>
</head>
<body>
    <!-- Верхняя панель заголовка Office 365 / Excel Web -->
    <header class="titlebar">
        <div class="tb-left">
            <button class="icon-btn waffle" title="Open work view" data-ru-title="Средство запуска приложений" aria-label="Applications" data-ru-aria-label="Приложения" onclick="App.toggleBoss()">
                <svg viewBox="0 0 16 16" width="16" height="16"><g fill="currentColor"><circle cx="3" cy="3" r="1.25"/><circle cx="8" cy="3" r="1.25"/><circle cx="13" cy="3" r="1.25"/><circle cx="3" cy="8" r="1.25"/><circle cx="8" cy="8" r="1.25"/><circle cx="13" cy="8" r="1.25"/><circle cx="3" cy="13" r="1.25"/><circle cx="8" cy="13" r="1.25"/><circle cx="13" cy="13" r="1.25"/></g></svg>
            </button>
            <span class="excel-logo" title="Excel">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <rect x="6" y="2" width="16" height="20" rx="2" fill="#21a366"/>
                    <path d="M6 7h16v5H6z" fill="#107c41"/>
                    <path d="M6 12h16v5H6z" fill="#185c37" opacity=".45"/>
                    <path d="M14 2v20" stroke="#107c41" stroke-width=".8" opacity=".5"/>
                    <rect x="2" y="5" width="12" height="14" rx="2" fill="#185c37"/>
                    <path d="M5.2 8.5l5.6 7m0-7l-5.6 7" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="doc-title" id="docTitle" onclick="App.renameWorkbook()" title="Rename workbook" data-ru-title="Нажмите, чтобы переименовать книгу Excel" data-ru-copy="Книга1.xlsx">Book1.xlsx</span>
            <span class="cloud-status" id="saveStatus" title="Saved" data-ru-title="Сохранено">
                <svg viewBox="0 0 16 16" width="15" height="15">
                    <path d="M4.6 12.5h7.2a2.7 2.7 0 00.4-5.37A3.8 3.8 0 004.9 5.6 3.2 3.2 0 004.6 12.5z" fill="none" stroke="#107c41" stroke-width="1.35"/>
                    <path d="M6.2 9.1l1.4 1.4 2.7-2.7" fill="none" stroke="#107c41" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="status-text" hidden data-ru-copy="Сохранено">Saved</span>
            </span>
        </div>

        <div class="tb-search">
            <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="6.8" cy="6.8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.2 10.2L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input type="text" placeholder="Search tools and help" data-ru-placeholder="Поиск инструментов, справки и другого (ALT + Ы)" aria-label="Search" data-ru-aria-label="Поиск" id="searchBox">
        </div>

        <div class="tb-right">
            <button class="icon-btn" onclick="App.openSettings()" title="Hero settings" data-ru-title="Параметры героя и ИИ (TabEscape Pro)" aria-label="Settings" data-ru-aria-label="Параметры">
                <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 5.4a2.6 2.6 0 100 5.2 2.6 2.6 0 000-5.2zM8 1.2l.9 1.7 1.9-.4.5 1.9 1.8.9-.9 1.7.9 1.7-1.8.9-.5 1.9-1.9-.4L8 14.8l-.9-1.7-1.9.4-.5-1.9-1.8-.9.9-1.7-.9-1.7 1.8-.9.5-1.9 1.9.4L8 1.2z" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round"/></svg>
            </button>
            <span class="avatar" title="Azat Sergaliev" data-ru-title="Азат Сергалиев (АС)" onclick="App.openSettings()" data-ru-copy="АС">AS</span>
        </div>
    </header>

    <!-- Строка меню и лента инструментов -->
    <nav class="ribbon" id="ribbon">
        <div class="menubar">
            <div class="ribbon-tabs" id="ribbonTabs"></div>
            <div class="menubar-actions">
                <button class="mb-btn" onclick="App.gotoSheet('log')" title="Comments and adventure journal" data-ru-title="Примечания и дневник приключений">
                    <svg viewBox="0 0 16 16" width="13" height="13"><path d="M2.5 3h11a1 1 0 011 1v7a1 1 0 01-1 1H6l-3.5 2.5V12a1 1 0 01-1-1V4a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg>
                    <span data-ru-copy="Примечания">Comments</span>
                </button>
                <button class="mb-btn icon-only" onclick="App.gotoSheet('adv')" title="Go to adventure" data-ru-title="Перейти к приключению">
                    <svg viewBox="0 0 16 16" width="13" height="13"><path d="M1.5 10.5l3.2-3.2 2.6 2.6 4.2-5 3 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="mb-btn" id="modeBtn" onclick="App.toggleBoss()" title="Switch work view (Esc)" data-ru-title="Переключить режим маскировки (Босс-клавиша Esc)">
                    <svg viewBox="0 0 16 16" width="13" height="13"><path d="M11.8 2.2l2 2L5.5 12.5 2.5 13.5l1-3 8.3-8.3z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg>
                    <span class="chev">▾</span>
                </button>
                <button class="mb-btn share-green" onclick="App.exportXlsx()" title="Export formatted Excel workbook (.xlsx)" data-ru-title="Экспортировать книгу Excel (.xlsx) со всеми цветами и стилями">
                    <svg viewBox="0 0 16 16" width="13" height="13"><path d="M9.5 2.5h4v4M13.5 2.5L7.5 8.5M6.5 4H3.5a1 1 0 00-1 1v7.5a1 1 0 001 1H11a1 1 0 001-1v-3" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span data-ru-copy="Поделиться">Share</span>
                    <span class="chev">▾</span>
                </button>
                <button class="icon-btn small ribbon-toggle" id="ribbonToggleBtn" onclick="App.toggleRibbon()" title="Collapse or expand the ribbon" data-ru-title="Свернуть или развернуть ленту инструментов">
                    <svg viewBox="0 0 16 16" width="12" height="12"><path id="ribbonTogglePath" d="M3.5 10L8 5.5 12.5 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </div>
        <div class="ribbon-body" id="ribbonBody"></div>
    </nav>

    <!-- Строка формул -->
    <div class="formula-bar">
        <div class="name-box-wrap">
            <input class="name-box" id="nameBox" value="A1" aria-label="Cell name" data-ru-aria-label="Имя ячейки" title="Enter a cell address, such as B5, and press Enter" data-ru-title="Имя ячейки (введите адрес, например B5, и нажмите Enter)">
            <span class="nb-chev">▾</span>
        </div>
        <div class="fb-actions">
            <button class="icon-btn small" title="Cancel (Esc)" data-ru-title="Отмена (Esc)" onclick="App.cancelEdit()">✕</button>
            <button class="icon-btn small ok" title="Enter" data-ru-title="Ввод (Enter)" onclick="App.commitFormula()">✓</button>
            <button class="icon-btn small fx-btn" title="Insert function" data-ru-title="Вставить функцию" onclick="App.insertFn()"><span class="fx">fx</span><span class="nb-chev">▾</span></button>
        </div>
        <div class="formula-input-wrap">
            <input type="text" id="formulaInput" class="formula-input" autocomplete="off" spellcheck="false"
                   placeholder="">
            <span class="fb-expand" title="Expand formula bar" data-ru-title="Развернуть строку формул">⌄</span>
        </div>
    </div>

    <!-- Табличная сетка -->
    <main class="grid-wrap" id="gridWrap">
        <div class="grid-scroll" id="gridScroll">
            <table class="grid" id="grid"></table>
            <div class="chart-object" id="chartObject" hidden></div>
        </div>
    </main>

    <!-- Нижняя панель листов и строка состояния -->
    <footer class="bottom">
        <div class="sheet-bar">
            <div class="sheet-nav">
                <button class="icon-btn small" id="navPrev" onclick="App.scrollTabs(-220)" title="Scroll sheets left" data-ru-title="Прокрутить вкладки влево">‹</button>
                <button class="icon-btn small" id="navNext" onclick="App.scrollTabs(220)" title="Scroll sheets right" data-ru-title="Прокрутить вкладки вправо">›</button>
                <button class="icon-btn small" id="allSheetsBtn" onclick="App.toggleSheetsMenu()" title="All sheets" data-ru-title="Все листы">≡</button>
            </div>
            <div class="sheet-tabs" id="sheetTabs"></div>
            <button class="icon-btn small add-sheet" title="Add sheet" data-ru-title="Добавить новый лист" onclick="App.addSheet()">＋</button>
        </div>

        <div class="statusbar">
            <div class="sb-left">
                <span class="sb-workbook-stats" onclick="App.showWorkbookStats()" title="Workbook statistics" data-ru-title="Статистика рабочей книги" data-ru-copy="Статистика книг">Workbook statistics</span>
                <span id="sbReady" class="sb-ready" data-ru-copy="Готово">Ready</span>
            </div>
            <div class="sb-mid" id="sbStats"></div>
            <div class="sb-right">
                <span class="sb-ico" title="Collapse status bar" data-ru-title="Свернуть строку состояния">⌄</span>
                <span class="sb-ico" title="Esc switches views. Keys 1–3 choose an action." data-ru-title="Сочетания клавиш: Esc — Босс-режим, 1-3 — ход">⌨</span>
                <span class="sb-ico" title="Help" data-ru-title="Справка" onclick="App.openSettings()">?</span>
                <span class="sb-ico" title="Normal view" data-ru-title="Обычный режим просмотра">▤</span>
                <button class="icon-btn tiny" onclick="App.zoomBy(-10)" title="Zoom out" data-ru-title="Уменьшить масштаб">−</button>
                <input type="range" id="zoomRange" min="60" max="160" step="10" value="100" aria-label="Zoom" data-ru-aria-label="Масштаб" hidden>
                <span id="zoomLabel" class="zoom-label" onclick="App.resetZoom()" title="Zoom (select for 100%)" data-ru-title="Масштаб (нажмите для 100%)">100 % ▾</span>
                <button class="icon-btn tiny" onclick="App.zoomBy(10)" title="Zoom in" data-ru-title="Увеличить масштаб">＋</button>
                <button class="icon-btn tiny" onclick="App.toggleFullscreen()" title="Full screen" data-ru-title="Во весь экран">⛶</button>
            </div>
        </div>
    </footer>

    <!-- Всплывающее меню выбора листа -->
    <div class="sheets-popup" id="sheetsPopup" hidden></div>

    <!-- Скрытые инпуты для выбора файлов и палитры цветов -->
    <input type="file" id="fileInput" accept=".xlsx,.csv,.tsv,.txt" hidden>
    <input type="color" id="bgColorPicker" value="#dce6f2" hidden>
    <input type="color" id="fgColorPicker" value="#ff0000" hidden>
    <div class="toast" id="toast" role="status"></div>

    <!-- Диалог Pro-настроек -->
    <div class="modal-backdrop" id="settingsModal" hidden>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
            <div class="dlg-head">
                <h2 id="dlgTitle" data-ru-copy="Параметры героя и конфигурация ИИ">Hero settings</h2>
                <button class="icon-btn" onclick="App.closeSettings()" aria-label="Close" data-ru-aria-label="Закрыть">✕</button>
            </div>
            <div class="dlg-body">
                <p class="dlg-desc" data-ru-copy="Esc переключает игру и рабочий экран. При повторном нажатии вы вернётесь к той же сцене.">Esc switches between the game and the work view. Press it again to return to the same scene.</p>
                <label for="inputRole" data-ru-copy="Имя и класс вашего героя">Hero name and class</label>
                <input type="text" id="inputRole" maxlength="60" placeholder="For example, apprentice adventurer" data-ru-placeholder="Например: Начинающий искатель, Странствующий маг">
                <label for="inputBoss" data-ru-copy="Имя Мастера Гильдии или наставника">Guildmaster or mentor</label>
                <input type="text" id="inputBoss" maxlength="60" placeholder="For example, Guildmaster Morgan" data-ru-placeholder="Например: Мастер Гильдии Морган">
                <label hidden for="inputApiKey" data-ru-copy="Необязательный ключ Groq или Gemini">Optional Groq or Gemini API key</label>
                <input hidden disabled type="password" id="inputApiKey" placeholder="Leave blank for the built-in story engine" data-ru-placeholder="Оставьте пустым — работает встроенный сюжетный движок" autocomplete="off">
                <small class="hint" data-ru-copy="Вы можете создавать листы Excel с нуля (кнопка «Новая книга» или «+») либо загружать любой .xlsx файл с компьютера.">Use New workbook or + to create sheets. Open an existing .xlsx file from your computer.</small>
            </div>
            <div class="dlg-foot">
                <button class="btn" onclick="App.closeSettings()" data-ru-copy="Отмена">Cancel</button>
                <button class="btn primary" onclick="App.saveSettings()" data-ru-copy="Применить и начать">Apply and restart</button>
            </div>
        </div>
    </div>

    <script type="application/json" id="adventure-data">{"scenes":{"start":{"narrative":"Вы просыпаетесь на мягком сене в повозке, которая бодро катится по солнечной дороге к городку Оукхейвен. Весёлый возница насвистывает мелодию и говорит, что сегодня в городе ярмарка и день приёма в Гильдию искателей. У вас в кармане пара монет и рекомендательное письмо к мастеру {boss}.","audit_log":"=ЕСЛИ(УТРО=\"СОЛНЕЧНОЕ\";НАЧАТЬ_ПРИКЛЮЧЕНИЕ();СПАТЬ)","options":[["На полном ходу выпрыгнуть из повозки в придорожные кусты, чтобы срезать путь","За кустами оказался глубокий колючий овраг! Вы кубарем скатились вниз и сильно ушиблись.",[-45,-20,15],null,"woods"],["Расспросить возницу, чем живёт город и куда лучше сходить в первую очередь","Возница с улыбкой советует заглянуть на площадь у фонтана: оттуда легко дойти и до Гильдии, и до таверны.",[0,0,0],null,"crossroads"],["Спокойно доехать до городских ворот и выйти на главную площадь","Повозка мягко останавливается у резных ворот Оукхейвена, и вы выходите навстречу утренней суете.",[0,0,0],"Письмо в Гильдию","crossroads"]]},"crossroads":{"narrative":"Вы стоите у красивого каменного фонтана в центре Оукхейвена. Налево ведёт улочка к уютной таверне «Золотой Жёлудь», прямо высится дом Гильдии искателей, а направо шумят пёстрые шатры ярмарки.","audit_log":"=ВЫБОР(МАРШРУТ;\"ТАВЕРНА\";\"ГИЛЬДИЯ\";\"ЯРМАРКА\")","options":[["Пойти налево в таверну «Золотой Жёлудь» и узнать свежие новости","Вы толкаете дубовую дверь и заходите в прохладный зал таверны.",[0,0,0],null,"tavern"],["Направиться прямо в Гильдию искателей к доске поручений","Вы поднимаетесь по широким ступеням и входите в светлый зал Гильдии.",[0,0,0],null,"guild"],["Свернуть направо и прогуляться по рядам утренней ярмарки","Вы ныряете в весёлую толпу между лавками с диковинками и выпечкой.",[0,0,0],null,"market"]]},"tavern":{"narrative":"В таверне вкусно пахнет свежим хлебом и печёными яблоками. Рыжеволосая хозяйка Марта протирает кружки за стойкой, у камина отдыхает бывалый следопыт с картой, а в углу хмурый громила спорит с наёмниками.","audit_log":"=ВПР(\"ТАВЕРНА\";НОВОСТИ_ГОРОДА;1;ЛОЖЬ)","options":[["Подойти к следопыту у камина и просто спросить, какие места вокруг стоит посетить","Старик охотно рассказывает о говорящем коте в башне мага и дарит вам свою дорожную карту.",[0,0,0],"Карта долины","wizard_tower"],["Спросить у хозяйки Марты, нет ли у неё несложного поручения по пути","Марта просит отнести свёрток специй на ярмарку и угощает вас горячим яблочным пирожком.",[15,10,-5],"Тёплый пирожок","market"],["Пнуть стул хмурого громилы и вызвать всю его компанию на кулачный бой","Три вышибалы одновременно хватают вас за шиворот и выкидывают в окно прямо на бочки!",[-50,-25,25],null,"alley"]]},"guild":{"narrative":"В зале Гильдии кипит работа: новички рассматривают карты, а мастер {boss} разбирает утренние отчёты. За стойкой улыбчивая девушка-секретарь готова подсказать подходящее задание.","audit_log":"=ЕСЛИ(НОВИЧОК;КОНСУЛЬТАЦИЯ();ВЫБОР_КВЕСТА)","options":[["Подойти к секретарю и спросить, с какого простого задания лучше начать","Девушка советует проведать башню мага Корнелиуса у реки — там как раз нужен толковый помощник.",[0,0,0],"Значок Гильдии","wizard_tower"],["Посмотреть карту маршрутов на стене и пойти к речной переправе","Вы запоминаете дорогу и выходите из города по живописной тропинке к реке.",[0,0,0],null,"river_ferry"],["Без подготовки схватить учебный магический посох со стойки и ударить им об пол","Посох детонирует учебной молнией прямо у вас в руках! Половина зала сбегается тушить ваш плащ.",[-45,-35,30],null,"crossroads"]]},"market":{"narrative":"На ярмарке полно интересного: травница разложила душистые сборы, часовой мастер чинит карманные компасы, а у края площади стоит указатель в сторону Зелёной Рощи.","audit_log":"=СУММ(ТОВАРЫ_ЯРМАРКИ)","options":[["Поговорить с травницей и расспросить о полезных растениях долины","Травница бесплатно даёт вам карманную памятку и советует прогуляться к Зелёной Роще.",[0,0,0],"Справочник трав","woods"],["Спросить у часового мастера дорогу к старой ветряной мельнице","Мастер указывает на холм за рекой и дарит вам исправный латунный компас.",[0,0,0],"Старинный компас","windmill"],["Залпом выпить кипящую синюю колбу с прилавка алхимика без спроса","Это оказался концентрированный клей для подков! Желудок скручивает так, что в глазах темнеет!",[-50,-25,20],null,"crossroads"]]},"wizard_tower":{"narrative":"У крыльца аккуратной круглой башни на солнышке греется толстый рыжий кот в маленькой шляпе мага. Из открытого окна доносится весёлое посвистывание чародея Корнелиуса.","audit_log":"=ЕСЛИ(КОТ_В_ШЛЯПЕ=ИСТИНА;ВЕЖЛИВОСТЬ();РАЗРЯД)","options":[["Поздороваться с котом и вежливо спросить, можно ли войти в башню","Кот поправляет лапой шляпу, человеческим голосом говорит: «Добро пожаловать!» и катит вам амулет.",[0,0,-5],"Кошачий амулет","ruins"],["Спросить у выглянувшего в окно мага дорогу к речной переправе","Корнелиус машет вам рукой, показывает короткую тропинку к реке и кидает фляжку яблочного тоника.",[10,10,0],"Зелье бодрости","river_ferry"],["Схватить кота за хвост и попытаться выбить дверь башни с разбега","Защитная руна на двери вспыхивает и отбрасывает вас через весь двор прямо в колючий крыжовник!",[-50,-25,25],null,"woods"]]},"woods":{"narrative":"Утоптанная тропинка идёт через светлую берёзовую рощу. На пеньке у развилки сидит странствующий музыкант с лютней, а деревянный указатель показывает две дороги — к Речной переправе и к Тёплому Утёсу.","audit_log":"=ЕСЛИ(РАЗВИЛКА_В_ЛЕСУ;ВЫБРАТЬ_ТРОПУ();ПРИВАЛ)","options":[["Остановиться и спросить у музыканта, куда лучше пойти дальше","Музыкант играет бодрый аккорд и советует подняться на Тёплый Утёс — там отличные виды и совсем не страшно.",[0,0,-5],null,"dragon_hill"],["Пойти по нижней лесной дорожке в сторону Речной переправы","Вы спокойно идёте под шелест листвы и вскоре слышите плеск речной воды.",[0,0,0],null,"river_ferry"],["Залезть на самое тонкое сухое дерево над обрывом, чтобы достать дикий улей","Ветка с треском ломается! Вы падаете с высоты прямо в рой разъярённых диких шершней!",[-50,-25,15],null,"camp"]]},"river_ferry":{"narrative":"Широкая река искрится на солнце. На пристани добродушный паромщик готовит лодку к отплытию, а чуть правее через реку перекинут крепкий каменный мост, ведущий к белым колоннам старой обсерватории.","audit_log":"=ЕСЛИ(ПЕРЕПРАВА;ПАРОМ_ИЛИ_МОСТ();ОПАСНОСТЬ)","options":[["Попросить паромщика перевезти вас на другой берег к ветряной мельнице","Паромщик охотно берёт вас на борт и за пару минут перевозит через тихую заводь.",[0,0,0],null,"windmill"],["Перейти по каменному мосту и направиться к старой обсерватории на холме","Вы неспешно переходите мост, любуясь рекой, и выходите к саду с белыми колоннами.",[0,0,0],null,"ruins"],["Разбежаться и прыгнуть с пирса прямо под лопасти водяного колеса","Бурное течение затягивает вас под колесо! Паромщик чудом вылавливает вас багром на мелководье.",[-55,-35,20],null,"camp"]]},"windmill":{"narrative":"У старой ветряной мельницы пахнет свежей мукой и клевером. Мельник сидит на лавочке и смеётся: маленькие лесные еноты утащили его связку ключей в беседку у сада.","audit_log":"=ЕСЛИ(ЕНОТЫ_С_КЛЮЧАМИ;УГОСТИТЬ();ПОИСК)","options":[["Протянуть енотам корочку хлеба и по-доброму обменять её на ключи","Еноты с удовольствием берут угощение, отдают связку, а мельник дарит вам серебряный талисман!",[5,5,-10],"Серебряный ключ","ruins"],["Спросить у мельника дорогу к Тёплому Утёсу и продолжить прогулку","Мельник показывает удобную тропинку через луг, и вы отправляетесь к предгорьям.",[0,0,0],null,"dragon_hill"],["Ухватиться руками за огромное вращающееся крыло ветряной мельницы","Крыло поднимает вас на десять метров вверх и с размаху швыряет в стог колючего чертополоха!",[-45,-30,15],null,"camp"]]},"ruins":{"narrative":"Белые колонны старой Эльфийской Обсерватории утопают в цветах. На скамейке девушка-учёный делает зарисовки солнечных часов, а от сада расходятся две аккуратные дорожки.","audit_log":"=ЕСЛИ(ОБСЕРВАТОРИЯ;ОСМОТР_ЧАСОВ();ВЫБОР_ПУТИ)","options":[["Поинтересоваться у девушки-учёного, как работают старинные солнечные часы","Она с радостью показывает секретный поворот стрелки — из тайника выпадает красивая солнечная линза!",[0,0,0],"Линза рассвета","dragon_hill"],["Пройти по садовой аллее в сторону уютного привала путников","Дорожка мягко спускается с холма к поляне, где вьётся дымок костра.",[0,0,0],null,"camp"],["Изо всех сил пнуть тяжёлую каменную колонну у края террасы","Сверху срывается каменный карниз и больно прилетает вам прямо по макушке!",[-45,-20,20],null,"woods"]]},"dragon_hill":{"narrative":"На согретой солнцем вершине Тёплого Утёса лежит золотистая драконица Аурелия в больших очках для чтения и листает сборник сказок. Рядом с ней стоит самовар с горным чаем и указатель обратно в долину.","audit_log":"=ЕСЛИ(ДРАКОН_ЧИТАЕТ;ВЕЖЛИВЫЙ_РАЗГОВОР();ОЖОГ)","options":[["Вежливо поздороваться с драконицей и спросить, интересная ли книга","Аурелия радостно угощает вас чаем с мёдом и дарит на память блестящую золотую чешуйку!",[15,15,-10],"Чешуйка удачи","camp"],["Полюбоваться видом на долину со смотровой площадки и спуститься к привалу","Вы делаете пару глубоких вдохов горного воздуха и легко спускаетесь по тропинке.",[0,0,0],null,"camp"],["Подкрасться сзади, выхватить у драконицы книгу и заорать ей прямо в ухо","От неожиданности Аурелия чихает облаком пламени! С дымящимися бровями вы летите кувырком с холма!",[-55,-35,30],null,"woods"]]},"camp":{"narrative":"На лесной поляне у ручья горит костёр, вокруг которого отдыхают торговцы и странники. В котелке аппетитно булькает похлёбка, а широкая дорога от поляны ведёт обратно в Оукхейвен.","audit_log":"=ЕСЛИ(ПРИВАЛ_У_КОСТРА;ОТДЫХ();В_ДОРОГУ)","options":[["Присесть к костру, послушать весёлые истории путников и передохнуть","Тёплый обед и дружеская компания возвращают вам силы и отличное настроение.",[15,15,-10],null,"crossroads"],["Спросить у караванщика дорогу и неспешно вернуться на площадь Оукхейвена","Вы идёте вместе с попутчиками по ровной дороге и возвращаетесь к городскому фонтану.",[0,0,0],null,"crossroads"],["Прыгнуть обеими ногами прямо в костёр, чтобы показать всем свою удаль","Сапоги вспыхивают! Путники окатывают вас ледяной водой из ведра, но ожоги весьма чувствительны.",[-45,-25,20],null,"tavern"]]},"alley":{"narrative":"Вы оказываетесь в тихом солнечном переулке за пекарней. На лавочке добродушный городской стражник кормит голубей булочкой, а за углом виден выход на главную площадь.","audit_log":"=ЕСЛИ(ПЕРЕУЛОК;СПРОСИТЬ_ДОРОГУ();ШТРАФ)","options":[["Спросить у стражника, как быстрее пройти к зданию Гильдии","Стражник с улыбкой указывает на короткий проход через арку прямо к дверям Гильдии.",[0,0,-5],null,"guild"],["Спокойно выйти из переулка обратно к фонтану на главной площади","Через полминуты вы уже снова стоите в центре Оукхейвена.",[0,0,0],null,"crossroads"],["Попытаться отобрать у стражника его шлем и алебарду","Стражник ловким подсечкой отправляет вас на мостовую и выписывает внушительный подзатыльник!",[-45,-30,35],null,"crossroads"]]}},"generic":["Вы спокойно продолжаете прогулку по солнечной долине.","Прохожие дружелюбно кивают вам, и вы идёте дальше.","Лёгкий ветерок шелестит листвой над дорогой."],"english":{"start":["You wake on a bed of hay as a wagon rattles toward Oakhaven. Today is the town fair and the Adventurers’ Guild is taking on recruits. In your pocket are two coins and a letter for {boss}.",["Jump from the moving wagon to take a shortcut through the bushes.","Ask the driver where a newcomer should go first.","Ride to the gates and step out onto the town square."],["The bushes hide a steep ravine. You tumble through the brambles and land hard.","The driver points you toward the fountain. From there, both the guild and the tavern are an easy walk.","The wagon eases to a stop at the carved gates. You step into the morning bustle."]],"crossroads":["Water splashes into a stone fountain in the middle of Oakhaven. The Golden Acorn tavern stands to your left, the guildhall is straight ahead, and bright market stalls crowd the street to your right.",["Turn left for the Golden Acorn and the latest news.","Head straight to the guild’s job board.","Wander through the fair on your right."],["You push open the oak door and step into the cool tavern.","You climb the wide steps into the bright guildhall.","You slip between stalls selling oddities and fresh pastries."]],"tavern":["The tavern smells of bread and baked apples. Marta polishes mugs at the counter. A ranger studies a map by the fire while a bruiser argues with some mercenaries.",["Ask the ranger what’s worth seeing nearby.","Ask Marta if she needs an errand run.","Kick the bruiser’s chair and challenge his entire table."],["The ranger tells you about a talking cat at the wizard’s tower and gives you his map.","Marta sends you to the fair with a parcel of spices and a warm apple pie.","Three bouncers toss you through the window and onto a stack of barrels."]],"guild":["Recruits crowd around the maps while {boss} sorts the morning reports. The clerk at the counter looks up, ready to find you an assignment.",["Ask the clerk for a first assignment.","Check the wall map for the river crossing.","Grab a practice staff and strike it against the floor."],["The clerk sends you to Cornelius’s tower. The wizard could use a steady pair of hands.","You memorize the route and follow a leafy path out of town.","A practice lightning bolt bursts in your hands. Half the hall rushes to put out your cloak."]],"market":["At the fair, a herbalist lays out fragrant bundles and a clockmaker repairs pocket compasses. A sign points toward the Green Grove.",["Ask the herbalist about plants in the valley.","Ask the clockmaker for directions to the old windmill.","Gulp down the alchemist’s bubbling blue potion."],["The herbalist hands you a pocket guide and recommends the Green Grove.","The clockmaker points across the river and gives you a repaired brass compass.","That was concentrated horseshoe glue. Your stomach twists and the square spins."]],"wizard_tower":["A plump ginger cat in a tiny wizard’s hat lounges on the tower steps. Cornelius whistles a tune through the open window.",["Greet the cat and ask permission to enter.","Ask Cornelius for directions to the ferry.","Pull the cat’s tail and charge the tower door."],["The cat straightens its hat. “Welcome,” it says, rolling an amulet to your feet.","Cornelius points to a riverside path and tosses you a flask of apple tonic.","A ward flashes. You sail across the yard into a thorny gooseberry bush."]],"woods":["A birchwood path forks beside a musician with a lute. A wooden sign points one way to the ferry and the other to Warm Crag.",["Ask the musician which path to take.","Follow the lower path toward the ferry.","Climb a dead tree above the drop to reach a wild hive."],["The musician strums a bright chord and recommends the view from Warm Crag.","The leaves rustle overhead. Soon you hear running water.","The branch cracks. You drop straight into a swarm of furious hornets."]],"river_ferry":["Sunlight glints on the wide river. A ferryman readies his boat at the dock. A stone bridge leads toward the white pillars of the old observatory.",["Take the ferry toward the windmill.","Cross the stone bridge to the observatory.","Leap from the pier toward the spinning waterwheel."],["The ferryman welcomes you aboard and rows you across the quiet inlet.","You cross the bridge and reach a garden of pale columns.","The current pulls you under the wheel. The ferryman fishes you out just in time."]],"windmill":["Clover and fresh flour scent the air around the windmill. The miller laughs from a bench. Raccoons have stolen his keys and carried them into the garden.",["Trade the raccoons a crust of bread for the keys.","Ask the miller for the trail to Warm Crag.","Grab one of the windmill’s spinning sails."],["The raccoons take the bread. For returning his keys, the miller gives you a silver charm.","The miller points across a meadow toward the foothills.","The sail lifts you high into the air and flings you into prickly thistles."]],"ruins":["Flowers grow around the white pillars of the Elven Observatory. A scholar sketches a sundial on a bench where two garden paths meet.",["Ask the scholar how the old sundial works.","Follow the garden path toward the travelers’ camp.","Kick the heavy stone column at the edge of the terrace."],["She shows you how to turn the pointer. A sun lens drops from a hidden compartment.","The path slopes down to a clearing where campfire smoke rises.","A ledge breaks loose and a chunk of stone lands on your head."]],"dragon_hill":["Aurelia, a golden dragon in reading glasses, leafs through fairy tales atop Warm Crag. Mountain tea steams beside her, close to the sign for the valley.",["Greet Aurelia and ask about her book.","Enjoy the view, then descend toward camp.","Snatch the dragon’s book and shout in her ear."],["Aurelia pours you tea with honey and gives you a golden scale to remember her by.","You breathe in the mountain air and follow the trail down.","Aurelia sneezes a cloud of flame. You roll down the hill with smoking eyebrows."]],"camp":["Travelers and merchants sit around a fire beside the stream. Stew bubbles in a pot. A broad road leads back to Oakhaven.",["Sit by the fire, share stories, and rest.","Ask a merchant for the road back to the square.","Jump into the campfire to impress the travelers."],["A hot meal and good company restore your strength.","You walk with the caravan and return to the town fountain.","Your boots catch fire. A bucket of cold water saves them, but the burns sting."]],"alley":["In a sunny alley behind the bakery, a guard feeds crumbs to pigeons. The main square is just around the corner.",["Ask the guard for the quickest route to the guildhall.","Walk back to the fountain in the main square.","Try to take the guard’s helmet and halberd."],["The guard shows you an archway leading straight to the guild doors.","A moment later, you are back in the heart of Oakhaven.","The guard sweeps your feet from under you and sends you sprawling on the cobbles."]]},"workbook":"UEsDBBQAAAAIAIUBb13acxxjCwEAAKcCAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbK2SzU7DMBCEX8XytYrdckAIJemBnyNwKA+wOJvEiv/kdUvy9jhp4YBKufRk2Tsz39hyuR2tYQeMpL2r+EasOUOnfKNdV/H33XNxxxklcA0Y77DiExLf1uVuCkgsex1VvE8p3EtJqkcLJHxAlyetjxZS3sZOBlADdChv1utbqbxL6FKR5gxel4/Ywt4k9jTm42OPiIY4ezgKZ1bFIQSjFaQ8lwfX/KIUJ4LIzkVDvQ60ygIuzxLmyd+Ak+81P0zUDbI3iOkFbFbJ0chPH4cP7wdxOeRMS9+2WmHj1d5mi6AQERrqEZM1YlmFBe1Wl/mUJoN0bfoS+g95vvliILksmyuX+Mn/7iGXj1Z/AVBLAwQUAAAACACFAW9dmNrri64AAAAnAQAACwAAAF9yZWxzLy5yZWxzjc/BDoIwDAbgV1l6l4EHYwyDizHhavAB5lYGAdZlmwpv745iPHhs+vf707Je5ok90YeBrIAiy4GhVaQHawTc2svuCCxEabWcyKKAFQPUVXnFScZ0EvrBBZYMGwT0MboT50H1OMuQkUObNh35WcY0esOdVKM0yPd5fuD+04CtyRotwDe6ANauDv+xqesGhWdSjxlt/FHxlUiy9AajgGXiL/LjnWjMEgq8KvnmweoNUEsDBBQAAAAIAIUBb1201v6K0wAAACYBAAAPAAAAeGwvd29ya2Jvb2sueG1sjY9NTsNADIWvMvKeTooqhKIk3VRIXVaCNRoyTjNqxo7s4W/HTTgEC1b0DOmNOqV0z8Y/evLn96rlWxzMC4oGphrmswIMUss+0LaGh/u7q1swmhx5NzBhDe+osGyqV5bdE/PO5HPSGvqUxtJabXuMTmc8ImWlY4ku5VW2VkdB57VHTHGw10VxY6MLBGdCKf9hcNeFFlfcPkekdIYIDi5l89qHUaGpfj/oXzfkYja9WTxOn4ePaT99TT+5fudMJ3ntc2QwUoY8yNrPwTaVvRDsJWRzBFBLAwQUAAAACACFAW9dqyEsbsIAAACnAQAAGgAAAHhsL19yZWxzL3dvcmtib29rLnhtbC5yZWxzrZDNCgIxDIRfpeTuZncPImL1IoJX0Qco3ewP7raliT/79hZFUfDgwVOYhHwzzGJ1HXp1psiddxqKLAdFzvqqc42Gw34zmYFiMa4yvXekYSSG1XKxo95IeuG2C6wSw7GGViTMEdm2NBjOfCCXLrWPg5EkY4PB2KNpCMs8n2J8Z8AnU20rDXFbFaD2Y6Bf2L6uO0trb08DOfligRcfj9wSSYKa2JBoeK0Y76PIEhXwe5jyn2FYxj51+Ury0E97/Ch4eQNQSwMEFAAAAAgAhQFvXXtZ+KXtAQAA2gYAAA0AAAB4bC9zdHlsZXMueG1s7VVLb5wwEL73V1i+N4ZtmlYVELVbIfXSS1KpVwMDWPID2d5o6a+vX2TZPsJuz4WDZ4b5vpnPDKa4PwqOnkAbpmSJ85sMI5Ct6pgcSvztsX79HiNjqewoVxJKPIPB99WrwtiZw8MIYJFjkKbEo7XTB0JMO4Kg5kZNIN2TXmlBrXP1QMykgXbGgwQnuyy7I4IyiR1dr6Q1qFUHaUu8WyJVYX6gJ8pdYzkmVdEqrjTSQ1Piut7d+tuHJRUQ0/aUs0YzHySBYOFpyItc8drkCqvxpIzz53bf4BSpiolaC1rWzkHJfpwnt23SbV5k8nmb6YOmc757ewXCKM46XBX9sF8Ly7N3+9ugt0kPmOzgCF2J78LekRXjqVhYvdBG6c4Nx5nUGKsKDr11 <script>
const portableImages = JSON.parse(document.getElementById("adventure-data").textContent).images;
/* Local story engine for the single-file edition. Uses the original scene data. */
const localAdventure = (() => {
    const {scenes, english, generic, workbook} = JSON.parse(document.getElementById("adventure-data").textContent);
    const places = Object.keys(scenes).filter(key => key !== "start");
    const pick = items => items[Math.floor(Math.random() * items.length)];
    const shuffle = () => {
        const order = [0, 1, 2];
        for (let i = 2; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
        }
        return order;
    };
    function customTurn(action, en) {
        const text = action.toLowerCase();
        const match = words => words.some(word => text.includes(word));
        if (/^(использовать предмет|use item:)/.test(text))
            return [[25,25,-15], en ? "You use an item from your bag and feel your strength return." : "Предмет из сумки возвращает вам силы."];
        if (match(["спрос","узна","пойти","идти","осмотр","куда","дорог","поговор","бесед","ask","walk","inspect","talk","road"]))
            return [[0,0,0],en ? "You get your bearings and find an easy route." : "Вы расспрашиваете прохожих и находите удобный путь."];
        if (match(["отдых","перекус","чай","пирож","зелье","сон","костер","костёр","rest","snack","tea","sleep","potion"]))
            return [[15,15,-5],en ? "A little rest restores your strength and lifts your spirits." : "Небольшая передышка возвращает силы и поднимает настроение."];
        if (match(["удар","пнуть","прыг","драк","атак","украс","attack","kick","jump","fight","steal"]))
            return [[-40,-25,25],en ? "The reckless stunt leaves you bruised and scraped." : "Безрассудная выходка заканчивается синяками и ссадинами."];
        return [[0,0,0],pick(en ? ["You stroll down the sunlit lane.","A passerby waves, and you walk on.","A breeze rustles the trees along the road."] : generic)];
    }
    function play(url, data) {
        const en = data.language === "en";
        const fmt = value => value.replaceAll("{role}", () => data.role || (en ? "Apprentice adventurer" : "Начинающий искатель"))
                                 .replaceAll("{boss}", () => data.boss || (en ? "Guildmaster Morgan" : "Мастер Гильдии Морган"));
        let key = "start", order = [0,1,2], last = -1, streak = 0, item = null, result = "";
        const stats = {...(data.stats || {ROI:100, KPI:100, Anxiety:10})};
        if (url === "/api/action") {
            const [id, permutation, previous, repeats] = String(data.scene_id || "start:012:-1:0").split(":");
            const current = scenes[id] ? id : "start";
            last = Number(previous); streak = Number(repeats) || 0;
            const slot = Number(data.choice_idx);
            let delta, target;
            if (slot >= 0 && slot < 3) {
                const pos = Number((permutation || "012")[slot]);
                const choice = scenes[current].options[pos];
                [,result,delta,item,target] = choice;
                if (en) result = english[current][2][pos];
                streak = slot === last ? streak + 1 : 1;
                last = slot;
                if (streak >= 2) {
                    delta = [delta[0] - 25*streak,delta[1] - 20*streak,delta[2] + 20*streak];
                    item = null;
                    result += en ? ` Repeating choice ${slot+1} costs you ${25*streak} health.` : ` За повторение выбора вы теряете ${25*streak} здоровья.`;
                }
            } else {
                [delta,result] = customTurn(String(data.action || ""), en);
                streak = 0;
            }
            ["ROI","KPI","Anxiety"].forEach((stat,i) => stats[stat] = Math.max(0,Math.min(100,stats[stat]+delta[i])));
            const outcome = stats.ROI <= 0 ? 0 : stats.KPI <= 0 ? 1 : stats.Anxiety >= 100 ? 2 : -1;
            if (outcome >= 0) {
                const endings = en ? ["You pass out. A cart carries you to the infirmary.","Your energy runs out. You fall asleep on a roadside bench.","The town guard catches up. You spend the evening in the guild kitchen."] : ["Вы потеряли сознание. Вас отвозят в лазарет.","Силы иссякли. Вы засыпаете на скамейке у дороги.","Вас задержала городская стража. Вечер пройдёт на кухне Гильдии."];
                return {narrative:fmt(result)+" "+endings[outcome],stats,game_over:true,options:[],inventory_add:null,scene_id:null,audit_log:"=END()"};
            }
            const visited = new Set((data.seen || []).map(id => id.split(":")[0]));
            const unseen = places.filter(id => !visited.has(id));
            key = target && target !== current && scenes[target] ? target : pick(unseen.length ? unseen : places.filter(id => id !== current));
            order = shuffle();
        }
        const scene = scenes[key];
        return {
            narrative:fmt((result ? result+" " : "")+(en ? english[key][0] : scene.narrative)), stats,
            options:order.map(i=>fmt(en ? english[key][1][i] : scene.options[i][0])),
            inventory_add:item, game_over:false, audit_log:scene.audit_log,
            scene_id:[key,order.join(""),last,streak].join(":")
        };
    }
    function workbookBytes() {
        return Uint8Array.from(atob(workbook), char => char.charCodeAt(0)).buffer;
    }
    return {play,workbookBytes};
})();

        const names = {"СУММ":"SUM","СРЗНАЧ":"AVERAGE","ЕСЛИ":"IF","МИН":"MIN","МАКС":"MAX","ОКРУГЛ":"ROUND","СЧЁТ":"COUNT","СЧЕТ":"COUNT"};

        const border=edges.some(([,k])=>st[k])?add(borders,"<border>"+edges.map(([side,k])=>st[k]?`<${side} style="${String(st[k]).includes("1.5")?"medium":"thin"}"><color auto="1"/></${side}>`:`<${side}/>`).join("")+"</border>"):0;
        const format={pct:10,money:4,int:3,dec:2}[st.fmt]||0;
        const attrs=[st.align&&`horizontal="${xml(st.align)}"`,st.valign&&`vertical="${xml(st.valign==="middle"?"center":st.valign)}"`,st.wrap&&'wrapText="1"'].filter(Boolean);
        const n=add(formats,`<xf numFmtId="${format}" fontId="${font}" fillId="${fill}" borderId="${border}" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">${attrs.length?"<alignment "+attrs.join(" ")+"/>":""}</xf>`);registry.set(key,n);return n;
    }
    for(const [i,sheet] of sheets.entries()){
        const rows=new Map();
        for(const [r,c,raw,display,st] of [...sheet.cells].sort((a,b)=>a[0]-b[0]||a[1]-b[1])){
            let attr="",val="";
            if(typeof raw==="string" && raw.startsWith("=")){
                val="<f>"+xml(formula(raw))+"</f>";
                if(typeof display==="number"&&Number.isFinite(display))val+="<v>"+display+"</v>";
            } else if(typeof raw==="number"&&Number.isFinite(raw))val="<v>"+raw+"</v>";
            else if(typeof raw==="boolean"){attr=' t="b"';val=raw?"<v>1</v>":"<v>0</v>";}
            else {attr=' t="inlineStr"';val='<is><t xml:space="preserve">'+xml(raw)+'</t></is>';}
            if(!rows.has(r))rows.set(r,[]);
            rows.get(r).push(`<c r="${address(r,c)}" s="${style(st)}"${attr}>${val}</c>`);
        }
        const body=[...rows].map(([r,cells])=>`<row r="${r}"${sheet.rowH[r]?` ht="${Number(sheet.rowH[r])*.75}" customHeight="1"`:""}>${cells.join("")}</row>`).join("");
        const cols=sheet.cols.map((w,k)=>`<col min="${k+1}" max="${k+1}" width="${Math.max(1,(Number(w)-5)/7)}" customWidth="1"/>`).join("");
        const merges=sheet.merges.map(([r,c,rr,cc])=>`<mergeCell ref="${address(r,c)}:${address(rr,cc)}"/>`).join("");
        zip.file(`xl/worksheets/sheet${i+1}.xml`,`<worksheet xmlns="${ns}">${cols?"<cols>"+cols+"</cols>":""}<sheetData>${body}</sheetData>${merges?`<mergeCells count="${sheet.merges.length}">${merges}</mergeCells>`:""}</worksheet>`);
    }
    const section=(tag,arr)=>`<${tag} count="${arr.length}">${arr.join("")}</${tag}>`;
    zip.file("xl/styles.xml",`<styleSheet xmlns="${ns}">${section("fonts",fonts)}${section("fills",fills)}${section("borders",borders)}<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>${section("cellXfs",formats)}<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`);
    return zip.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
